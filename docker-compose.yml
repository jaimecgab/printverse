services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printverse}
      POSTGRES_USER: ${POSTGRES_USER:-printverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printverse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - printverse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-printverse}
      DB_USERNAME: ${POSTGRES_USER:-printverse}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-printverse}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SEED_DATA_ENABLED: ${SEED_DATA_ENABLED:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  printverse_postgres_data:
