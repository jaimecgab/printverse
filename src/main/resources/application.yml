spring:
  application:
    name: printverse
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/printverse}
    username: ${DB_USERNAME:printverse}
    password: ${DB_PASSWORD:printverse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_DATA_ENABLED:true}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: PrintVerse
      duration: ${JWT_DURATION:8h}
  bootstrap-admin:
    username: ${APP_ADMIN_USERNAME:admin}
    display-name: ${APP_ADMIN_DISPLAY_NAME:Administrador}
    password: ${APP_ADMIN_PASSWORD:}
    required: false
